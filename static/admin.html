<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题库管理端</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>题库管理端</h1><nav><a href="/">答题端</a><a href="/admin">管理端</a></nav></header><main class="card"><section id="adminLogin"><h2>管理员登录</h2><input id="adminUser" placeholder="用户名" value="admin"><input id="adminPass" type="password" placeholder="初始密码 admin123"><button onclick="adminLogin()">登录</button><span id="loginMsg"></span></section><section id="adminContent" hidden><button class="secondary" onclick="adminLogout()">退出登录</button><h3>修改密码</h3><input id="currentPassword" type="password" autocomplete="current-password" placeholder="当前密码"><input id="newPassword" type="password" autocomplete="new-password" placeholder="新密码（至少12位）"><button onclick="changePassword()">修改密码</button><span id="passwordMsg" role="status"></span><h2>题库统计</h2><div id="stats"></div><button onclick="importData(false)">重新导入 Excel</button><button class="secondary" onclick="importData(true)">清空后重新导入</button><span id="msg"></span><h3>Excel 批量导入</h3><input id="uploadFiles" type="file" accept=".xlsx,.xls" multiple><div id="excelPreview"></div><button id="confirmExcelImport" onclick="confirmExcelImport()" hidden>确认导入</button><span id="excelMsg" role="status"></span></section><hr><section id="questionAdmin" hidden><h2>题目管理</h2><div class="grid"><input id="search" placeholder="搜索题干" oninput="load()"><select id="chapterFilter" onchange="load()"><option value="">全部章节</option></select></div><div class="checks filter-types"><label><input type="checkbox" value="单选" checked onchange="load()"> 单选</label><label><input type="checkbox" value="多选" checked onchange="load()"> 多选</label><label><input type="checkbox" value="判断" checked onchange="load()"> 判断</label></div><button onclick="edit()">新增题目</button><div id="list"></div></section></main><div id="modal" class="card hidden"><h2 id="mtitle">编辑题目</h2><input type="hidden" id="qid"><label>题型<select id="qtype"><option>单选</option><option>多选</option><option>判断</option></select></label><label>章节<input id="chapter"></label><label>题干<textarea id="question"></textarea></label><label>答案（如 ABD 或 对）<input id="answer"></label><label>A选项<input id="A"></label><label>B选项<input id="B"></label><label>C选项<input id="C"></label><label>D选项<input id="D"></label><label>E选项<input id="E"></label><label>解析<textarea id="explanation"></textarea></label><button onclick="save()">保存</button><button class="secondary" onclick="closeModal()">取消</button></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/static/admin.js"></script></body></html>
