<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>题库管理端</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>题库管理端</h1><nav><a href="/">答题端</a><a href="/admin">管理端</a></nav></header>
  <main class="card admin-shell">
    <section id="adminLogin"><h2>管理员登录</h2><input id="adminUser" placeholder="用户名" value="admin"><input id="adminPass" type="password" placeholder="管理员密码"><button onclick="adminLogin()">登录</button><span id="loginMsg"></span></section>
    <section id="adminContent" hidden>
      <div class="admin-toolbar"><div><strong>管理控制台</strong><span class="muted">　题库、导入和账户设置</span></div><button class="secondary" onclick="adminLogout()">退出登录</button></div>
      <nav class="admin-tabs" aria-label="管理页面">
        <button class="tab active" data-page="overview" onclick="showPage('overview')">概览</button>
        <button class="tab" data-page="import" onclick="showPage('import')">题库导入</button>
        <button class="tab" data-page="questions" onclick="showPage('questions')">题目管理</button>
        <button class="tab" data-page="account" onclick="showPage('account')">账户设置</button>
      </nav>
      <section class="admin-page" data-page="overview"><h2>题库概览</h2><div id="stats" class="stats-panel"></div><div id="studentOverview" class="stats-panel"></div><p class="muted">题库内容由管理员维护，学生的错题、收藏和答题记录按账户隔离。</p></section>
      <section class="admin-page" data-page="import" hidden><h2>题库导入</h2><div class="import-actions"><button onclick="importData(false)">从服务器题库目录导入</button><button class="secondary" onclick="importData(true)">清空后重新导入</button><button class="danger" onclick="clearQuestionBank()">一键清空题库</button><button onclick="location.href='/api/questions/backup'">下载题库备份</button><label>恢复备份<input id="backupFile" type="file" accept=".json" onchange="restoreBackup()"></label><button onclick="location.href='/api/questions/export?format=csv'">导出CSV</button><button class="secondary" onclick="loadImportHistory()">导入历史</button><span id="msg" role="status"></span></div><div id="importHistory"></div><p class="muted">服务首次启动不会自动导入题库。导入完成后题目会保存到数据库，下次启动自动加载已保存题目。</p><h3>Excel 预览与字段映射</h3><input id="uploadFiles" type="file" accept=".xlsx,.xls" multiple><div id="excelPreview"></div><button id="confirmExcelImport" onclick="confirmExcelImport()" hidden>确认导入</button><span id="excelMsg" role="status"></span></section>
      <section class="admin-page" data-page="questions" hidden><div class="section-heading"><div><h2>题目管理</h2><span id="pageSummary" class="muted"></span></div><button onclick="edit()">新增题目</button></div><div class="import-actions"><label><input id="selectAllQuestions" type="checkbox" onchange="toggleAllQuestions(this.checked)"> 全选当前页</label><button class="danger" onclick="batchDelete()">批量删除选中</button><input id="batchChapter" placeholder="批量修改章节"><button onclick="batchUpdate()">批量修改章节</button></div><div class="grid"><input id="search" placeholder="搜索题干或章节" oninput="queueLoad()"><select id="chapterFilter" onchange="load(1)"><option value="">全部章节</option></select></div><div class="checks filter-types"><label><input type="checkbox" value="单选" checked onchange="load(1)"> 单选</label><label><input type="checkbox" value="多选" checked onchange="load(1)"> 多选</label><label><input type="checkbox" value="判断" checked onchange="load(1)"> 判断</label></div><div id="list"></div><div class="pagination"><button id="prevPage" class="secondary" onclick="load(currentPage-1)">上一页</button><span id="pageInfo"></span><button id="nextPage" class="secondary" onclick="load(currentPage+1)">下一页</button></div></section>
      <section class="admin-page" data-page="account" hidden><h2>修改管理员密码</h2><div id="usersList"></div><input id="currentPassword" type="password" autocomplete="current-password" placeholder="当前密码"><input id="newPassword" type="password" autocomplete="new-password" placeholder="新密码（至少12位）"><button onclick="changePassword()">修改密码</button><span id="passwordMsg" role="status"></span></section>
    </section>
  </main>
  <div id="modal" class="card hidden"><h2 id="mtitle">编辑题目</h2><input type="hidden" id="qid"><label>题型<select id="qtype"><option>单选</option><option>多选</option><option>判断</option></select></label><label>章节<input id="chapter"></label><label>题干<textarea id="question"></textarea></label><label>答案（如 ABD 或 对）<input id="answer"></label><label>A选项<input id="A"></label><label>B选项<input id="B"></label><label>C选项<input id="C"></label><label>D选项<input id="D"></label><label>E选项<input id="E"></label><label>解析<textarea id="explanation"></textarea></label><button onclick="save()">保存</button><button class="secondary" onclick="closeModal()">取消</button></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/static/admin.js"></script>
</body>
</html>
