<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题库管理端</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>题库管理端</h1><nav><a href="/">答题端</a><a href="/admin">管理端</a></nav></header><main class="card"><section><h2>题库统计</h2><div id="stats"></div><button onclick="importData(false)">重新导入 Excel</button><button class="secondary" onclick="importData(true)">清空后重新导入</button><span id="msg"></span></section><hr><section><h2>题目管理</h2><div class="grid"><input id="search" placeholder="搜索题干" oninput="load()"><select id="chapterFilter" onchange="load()"><option value="">全部章节</option></select></div><div class="checks filter-types"><label><input type="checkbox" value="单选" checked onchange="load()"> 单选</label><label><input type="checkbox" value="多选" checked onchange="load()"> 多选</label><label><input type="checkbox" value="判断" checked onchange="load()"> 判断</label></div><button onclick="edit()">新增题目</button><div id="list"></div></section></main><div id="modal" class="card hidden"><h2 id="mtitle">编辑题目</h2><input type="hidden" id="qid"><label>题型<select id="qtype"><option>单选</option><option>多选</option><option>判断</option></select></label><label>章节<input id="chapter"></label><label>题干<textarea id="question"></textarea></label><label>答案（如 ABD 或 对）<input id="answer"></label><label>A选项<input id="A"></label><label>B选项<input id="B"></label><label>C选项<input id="C"></label><label>D选项<input id="D"></label><label>E选项<input id="E"></label><label>解析<textarea id="explanation"></textarea></label><button onclick="save()">保存</button><button class="secondary" onclick="closeModal()">取消</button></div><script src="/static/admin.js"></script></body></html>
