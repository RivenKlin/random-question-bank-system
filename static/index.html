<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机题库答题</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>随机题库答题系统</h1><nav><a href="/">答题端</a><a href="/admin">管理端</a><span id="authStatus"></span></nav></header><main id="app"><section id="loginPanel" class="card"><h2>学生登录 / 注册</h2><div class="grid"><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码"></div><button onclick="login()">登录</button><button class="secondary" onclick="registerStudent()">注册学生账户</button><button class="secondary hidden" id="logoutButton" onclick="logout()">退出登录</button><span id="authMessage"></span></section><section id="config" hidden class="card"><h2>开始练习</h2><div class="grid"><label>单选题数量<input id="singleCount" type="number" min="0" max="100" value="5"></label><label>多选题数量<input id="multiCount" type="number" min="0" max="100" value="3"></label><label>判断题数量<input id="judgeCount" type="number" min="0" max="100" value="2"></label><label>章节<select id="chapter"><option value="">全部章节</option></select></label></div><div class="checks"><label><input id="wrong" type="checkbox"> 只练错题</label><label><input id="favorite" type="checkbox"> 只练收藏题</label></div><button onclick="startQuiz()">开始答题</button><button class="secondary" onclick="loadReview('wrong')">错题练习</button><button class="secondary" onclick="loadReview('favorite')">收藏练习</button><p class="muted form-hint">设置完成后点击“开始答题”，进入答题页面；交卷后才会查看答案和解析。</p></section><section id="quiz" hidden class="card quiz-layout"><aside id="questionNav"></aside><div class="quiz-main"><div class="quiz-head"><div><strong id="quizStatus">答题进行中</strong><span id="progress"></span></div><button class="secondary" onclick="toggleFavorite()" id="fav">收藏</button></div><h2 id="question"></h2><div id="options"></div><div id="emptyOptions" class="empty-state hidden">本题暂未读取到选项，请到管理端检查题目数据。</div><div class="pager"><button class="secondary" onclick="prev()">上一题</button><button class="secondary" onclick="next()">下一题</button><button onclick="submitQuiz()">交卷</button></div></div></section></main><script src="/static/app.js?v=1.0.1"></script></body></html>
