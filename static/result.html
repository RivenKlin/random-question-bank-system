<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>答题结果</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>答题结果检查</h1><nav><a href="/">重新练习</a><a href="/admin">管理端</a></nav></header><main class="card result-page"><div id="summary">正在加载结果...</div><div id="details"></div><button onclick="location.href='/'">重新开始</button></main><script>const data=JSON.parse(sessionStorage.getItem('quizResult')||'null');if(!data){document.getElementById('summary').innerHTML='<p>没有找到本次答题结果，请返回答题端重新开始。</p>'}else{document.getElementById('summary').innerHTML='<h2>本次答题完成</h2><div class="result-score">得分：'+data.score+'　答对：'+data.correct+' / '+data.total+'</div>';document.getElementById('details').innerHTML=data.results.map((x,i)=>'<div class="detail '+(x.correct?'correct':'wrong')+'"><b>'+ (i+1)+'. '+(x.correct?'回答正确':'回答错误')+'</b><div>你的答案：'+(x.user_answer||'未作答')+'　正确答案：'+x.answer+'</div><div class="muted">'+(x.explanation||'暂无解析')+'</div></div>').join('')}</script></body></html>
